name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Public pages read the database at build time, so the build needs one.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholders so env validation passes. Only the database is real.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Unit tests and permissions matrix
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Migrate the database
        run: |
          # Match Supabase, where the extensions schema is on the search_path.
          psql "$DIRECT_DATABASE_URL" -c "ALTER DATABASE postgres SET search_path TO public, extensions"
          pnpm db:migrate
      - name: Build
        run: pnpm build
      - name: First-load JavaScript budget
        run: pnpm check:bundle
      # Still to add as their pieces land: integration tests against local
      # Supabase, Playwright and axe on the preview deploy, Lighthouse CI.
